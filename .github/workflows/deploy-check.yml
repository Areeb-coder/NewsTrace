name: NewsTrace web and legacy deployment checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-and-legacy-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install and build Next.js frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Confirm static frontend output exists
        run: test -s frontend/out/index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run discovery, parser and job-store regression tests
        run: python -m unittest discover -s tests -v

      - name: Start FastAPI and check API plus frontend
        shell: bash
        env:
          NEWSTRACE_DB_PATH: ${{ runner.temp }}/newstrace-smoke.sqlite3
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > fastapi.log 2>&1 &
          echo $! > fastapi.pid
          python - <<'PY'
          import time
          import requests

          base = "http://127.0.0.1:8000"
          for attempt in range(60):
              try:
                  health = requests.get(f"{base}/api/health", timeout=2)
                  if health.ok and health.json().get("ok") is True:
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become healthy within 60 seconds.")

          response = requests.get(base, timeout=5)
          if response.status_code != 200 or "NewsTrace" not in response.text:
              raise SystemExit("The FastAPI service did not serve the exported Next.js homepage.")

          for path in ("/api/articles", "/api/categories", "/api/sources", "/api/coverage", "/api/journalists"):
              check = requests.get(base + path, timeout=5)
              if not check.ok:
                  raise SystemExit(f"{path} returned HTTP {check.status_code}: {check.text[:300]}")

          print("FastAPI health, static homepage and archive endpoints passed.")
          PY

      - name: Show FastAPI logs on failure
        if: failure()
        run: cat fastapi.log || true

      - name: Start legacy Streamlit and check health endpoint
        shell: bash
        run: |
          streamlit run app.py \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.headless=true \
            --browser.gatherUsageStats=false > streamlit.log 2>&1 &
          echo $! > streamlit.pid

          python - <<'PY'
          import time
          import requests

          health_url = "http://127.0.0.1:8501/_stcore/health"
          for attempt in range(60):
              try:
                  response = requests.get(health_url, timeout=2)
                  if response.ok and response.text.strip().lower() == "ok":
                      print("Legacy Streamlit health check passed.")
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Legacy Streamlit did not become healthy within 60 seconds.")
          PY

      - name: Show Streamlit logs on failure
        if: failure()
        run: cat streamlit.log || true
