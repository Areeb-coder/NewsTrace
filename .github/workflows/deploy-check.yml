name: NewsTrace deployment smoke test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Start Streamlit and check health endpoint
        shell: bash
        run: |
          streamlit run app.py \
            --server.address=127.0.0.1 \
            --server.port=8501 \
            --server.headless=true \
            --browser.gatherUsageStats=false > streamlit.log 2>&1 &
          echo $! > streamlit.pid

          python - <<'PY'
          import time
          import requests

          health_url = "http://127.0.0.1:8501/_stcore/health"
          for attempt in range(60):
              try:
                  response = requests.get(health_url, timeout=2)
                  if response.ok and response.text.strip().lower() == "ok":
                      print("Streamlit health check passed.")
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Streamlit did not become healthy within 60 seconds.")
          PY

      - name: Show Streamlit logs on failure
        if: failure()
        run: cat streamlit.log || true
