services:
  # One production service: static Next.js export + FastAPI + Playwright worker.
  - type: web
    name: newstrace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NEWSTRACE_MAX_ACTIVE_JOBS
        value: "1"
      - key: NEWSTRACE_REQUIRE_DURABLE_STORE
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
